<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Manipulação do DOM</title>
    
</head>
<style>
    body{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .tabuleiro{
        display: grid;
        grid-template-columns: repeat(3,100px);
        gap: 10px
    }
    .celula{
        display: flex;
        background-color: gray;
        width: 100px;
        height: 100px;
        justify-content: center;
        align-items: center;
        font-size: 46px;
        cursor: pointer;
    }
    #restart{
        padding: 15px;
        margin-top: 20px;
    }

</style>

<body>
    <h1>Jogo da Velha
    <div id="tabuleiro-jogo" class="tabuleiro">
        <button class="celula"></button>
        <button class="celula"></button>
        <button class="celula"></button>
        <button class="celula"></button>
        <button class="celula"></button>
        <button class="celula"></button>
        <button class="celula"></button>
        <button class="celula"></button>
        <button class="celula"></button>
    </div>
    <button id="restart">Reiniciar o jogo</button>
    </h1>

    <script src="aulaDom.js"></script>
</body>

</html>
