<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Validação de Formulário</title>
    
</head>
<style>
    label, button{
        display: block;
        }
</style>
<body>

    <h1>Formulário de Contato</h1>
    <form action="" id="contactForm" onsubmit="return validateForm()">
        <label for="telefone">Telefone: </label>
        <input type="text" id="telefone" required placeholder="(00) 00000-0000"/>
        <label for="email">Email: </label>
        <input type="text" id="email" required maxlength="356"/>
        <label for="senha">Senha: </label>
        <input type="text" id="senha" required>
        <button type="submit">Enviar Formulário</button>
    </form>
    <script src="exercicioForm.js"></script>
</body>

</html>
